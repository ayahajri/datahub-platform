# ===== application.properties (shared / default = dev) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/datahub_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

app.jwt.secret=${JWT_SECRET:CHANGE_ME_dev_only_do_not_use_in_prod_1234567890}
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500}
# Python microservice endpoint
python.service.url=http://localhost:8000

